<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/ffecc517d4.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <title>Login</title>
</head>
<body>
    <main>
        <div class="background">
        </div>
        <div class="form-wrapper">
            <form action="">
                <h2>Login</h2>
                <div class="form__fields">
                    <label class="form__field">
                        <input type="text" class="form__input" placeholder="username">
                        <i class="fa-regular fa-user"></i>
                    </label>
                    <label class="form__field">
                        <input type="password" class="form__input" placeholder="password">
                        <i class="fa-solid fa-lock"></i>
                    </label>
                    <label class="form__remenber-me">
                        <input type="checkbox"> 
                        Remember me
                    </label>
                    <a href="">forgot password</a>
                    <input type="submit" value="Login">
                    <span>don't have an account? <a href="">Register</a></span>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
